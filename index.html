<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AliLivreShop</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#F04A2A; /* mesma cor do print */
    font-family: Arial, sans-serif;
}

/* Container central */
.profile-container{
    text-align:center;
}

/* Foto circular */
.profile-pic{
    width:160px;
    height:160px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    box-shadow:0 8px 25px rgba(0,0,0,0.2);
}

/* Se quiser efeito hover opcional */
.profile-pic:hover{
    transform:scale(1.05);
    transition:0.3s;
}
</style>
</head>

<body>

<div class="profile-container">
    <!-- TROQUE A URL ABAIXO PELA FOTO DO PERFIL -->
    <img src="SUA_FOTO_AQUI.jpg" alt="Foto Perfil" class="profile-pic">
</div>

</body>
</html>
